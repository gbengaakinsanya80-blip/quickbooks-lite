<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickBooks Lite</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="backdrop" id="backdrop" onclick="closeSidebar()"></div>
  <div class="topbar">
    <button class="menu-btn" id="menu-btn" aria-label="Menu">&#9776;</button>
    <h1>QB Lite</h1>
  </div>
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>QB Lite</h2>
      <button class="sidebar-close" onclick="closeSidebar()">&times;</button>
    </div>
    <ul class="nav-menu">
      <li><a href="#" data-page="dashboard" class="nav-link active">
        <span class="icon">&#9632;</span> Dashboard
      </a></li>
      <li class="nav-section">SALES</li>
      <li><a href="#" data-page="invoices" class="nav-link">
        <span class="icon">&#9998;</span> Invoices
      </a></li>
      <li><a href="#" data-page="customers" class="nav-link">
        <span class="icon">&#9787;</span> Customers
      </a></li>
      <li class="nav-section">EXPENSES</li>
      <li><a href="#" data-page="bills" class="nav-link">
        <span class="icon">&#9998;</span> Bills
      </a></li>
      <li><a href="#" data-page="vendors" class="nav-link">
        <span class="icon">&#9787;</span> Vendors
      </a></li>
      <li><a href="#" data-page="payments" class="nav-link">
        <span class="icon">&#36;</span> Payments
      </a></li>
      <li><a href="#" data-page="expenses" class="nav-link">
        <span class="icon">&#36;</span> Write Check
      </a></li>
      <li class="nav-section">ACCOUNTING</li>
      <li><a href="#" data-page="accounts" class="nav-link">
        <span class="icon">&#9783;</span> Chart of Accounts
      </a></li>
      <li><a href="#" data-page="journal" class="nav-link">
        <span class="icon">&#9998;</span> Journal Entries
      </a></li>
      <li class="nav-section">REPORTS</li>
      <li><a href="#" data-page="profit-loss" class="nav-link">
        <span class="icon">&#9650;</span> Profit & Loss
      </a></li>
      <li><a href="#" data-page="balance-sheet" class="nav-link">
        <span class="icon">&#9660;</span> Balance Sheet
      </a></li>
      <li><a href="#" data-page="receivables" class="nav-link">
        <span class="icon">&#36;</span> A/R Aging
      </a></li>
      <li><a href="#" data-page="payables" class="nav-link">
        <span class="icon">&#36;</span> A/P Aging
      </a></li>
    </ul>
  </nav>
  <main class="content" id="content">
    <div id="page-container"></div>
  </main>
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>
